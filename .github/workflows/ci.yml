name: CI

on:
  push:
    branches: [Master, master, main]
  pull_request:
    branches: [Master, master, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: CLI smoke
        run: |
          ./target/release/shadowshell --version
          ./target/release/shadowshell --help | head -8
          ./target/release/shadowshell --welcome | head -5
          ./target/release/shadowshell -c 'true'
          ./target/release/shadowshell -c 'help' | head -3
          # Unknown theme must fail before opening an interactive TTY.
          if ./target/release/shadowshell --theme not-a-theme; then
            echo "expected unknown --theme to fail" >&2
            exit 1
          fi
