[package]
name = "shadowshell"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
glob = "0.3"
nix = { version = "0.31.3", features = ["process", "signal", "term", "fs"] }
nu-ansi-term = "0.50"
reedline = { version = "0.49.0", features = ["external_printer", "idle_callback"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.8"
